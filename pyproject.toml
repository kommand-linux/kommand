[project]
name = "kommand"
dynamic = ["version"]
description = "Universal Linux System Management Toolkit"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Kommand Contributors" }
]
keywords = [
    "linux", "sysadmin", "tui", "terminal",
    "system-management", "cli", "package-manager"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
]
requires-python = ">=3.9"

dependencies = [
    "textual>=0.80.0,<1.0.0",
    "psutil>=5.9.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
kommand = "kommand.main:main"

[project.urls]
Homepage = "https://github.com/kommand-dev/kommand"
Documentation = "https://github.com/kommand-dev/kommand/tree/main/docs"
Repository = "https://github.com/kommand-dev/kommand"
Issues = "https://github.com/kommand-dev/kommand/issues"
Changelog = "https://github.com/kommand-dev/kommand/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "kommand.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["kommand*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short -q"